spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seedance_generate}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  application:
    name: SeedanceGenarate
  # 定时任务线程池：推进器 / SSE 心跳 / token 清理各占一线程，互不阻塞（默认单线程会串行）
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
  sql:
    init:
      mode: always
      continue-on-error: true
server:
  port: ${SERVER_PORT:8080}
seedance:
  api-key: ${SEEDANCE_API_KEY:ark-4fd3cbba-3b28-478c-83d1-d783ed4c8a19-10558}
  # 单模型模式下的默认模型名（未配置下方 models 列表时生效；请求里的 model 参数无效）
  model: ${SEEDANCE_MODEL:doubao-seedance-2-0-260128}
  url: ${SEEDANCE_URL:https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks}
  # 多模型模式：配置后前端可选多个 Seedance 模型。
  # id=注册标识（/options 下发、模型开放闸门的 key），name=方舟 API 模型名，label=前端展示名。
  models:
    - id: seedance
      name: ${SEEDANCE_MODEL_1:doubao-seedance-2-0-260128}
      label: Seedance 2.0
    - id: seedance-fast
      name: ${SEEDANCE_MODEL_FAST:doubao-seedance-2-0-fast-260128}
      label: Seedance 2.0 Fast
    - id: seedance-mini
      name: ${SEEDANCE_MODEL_MINI:doubao-seedance-2-0-mini-260615}
      label: Seedance 2.0 Mini
video:
  # 请求未显式指定 provider 时的默认提供方
  default-provider: ${VIDEO_DEFAULT_PROVIDER:seedance}
  # 模型开放策略：没有被管理员显式开 / 关过的模型走这个默认（true=新模型默认开放、自动出现）
  model-access:
    default-open: ${VIDEO_MODEL_ACCESS_DEFAULT_OPEN:true}
  # 后台任务推进器：定时轮询 PROCESSING 任务拿远端状态并落库，是「前端不轮询、改 SSE 推送」的服务端状态源
  poll:
    enabled: ${VIDEO_POLL_ENABLED:true}
    # 轮询周期（毫秒）；上一轮跑完再等这么久开下一轮，天然不会堆叠
    interval-ms: ${VIDEO_POLL_INTERVAL_MS:2000}
    # 应用启动后延迟多久开始第一轮
    initial-delay-ms: ${VIDEO_POLL_INITIAL_DELAY_MS:5000}
    # 只推进最近这么多小时内创建的任务，避免长期卡住的历史行被无限轮询
    max-age-hours: ${VIDEO_POLL_MAX_AGE_HOURS:24}
    # 单轮最多处理多少条，控制每轮对提供方的压力
    batch-size: ${VIDEO_POLL_BATCH_SIZE:200}
  comfyui:
    # 调度策略：least-queue（按队列最闲）| round-robin
    scheduling: ${VIDEO_COMFYUI_SCHEDULING:least-queue}
    connect-timeout-ms: ${VIDEO_COMFYUI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${VIDEO_COMFYUI_READ_TIMEOUT_MS:60000}
    # 你的 ComfyUI 实例（同 host 不同 port）。填好并 enabled:true 后即可用 provider=comfyui
    nodes:
      - id: gpu-0
        base-url: ${COMFYUI_NODE0_URL:http://123.58.111.244:8189}
        enabled: ${COMFYUI_NODE0_ENABLED:true}
      - id: gpu-1
        base-url: ${COMFYUI_NODE1_URL:http://123.58.111.244:8190}
        enabled: ${COMFYUI_NODE1_ENABLED:true}
      - id: gpu-3
        base-url: ${COMFYUI_NODE3_URL:http://123.58.111.244:8191}
        enabled: ${COMFYUI_NODE3_ENABLED:true}
      - id: gpu-6
        base-url: ${COMFYUI_NODE6_URL:http://123.58.111.244:8192}
        enabled: ${COMFYUI_NODE6_ENABLED:true}
prompt-optimize:
  url: ${PROMPT_OPTIMIZE_URL:http://123.58.111.244:8081/v1/chat/completions}
  api-key: ${PROMPT_OPTIMIZE_API_KEY:sk-a7f8e3c2-9d4b-4e5f-8a7b-6c5d4e3f2a1b}
  model: ${PROMPT_OPTIMIZE_MODEL:gemma-4-31b}
file:
  upload-path: ${FILE_UPLOAD_PATH:./data/images}
billing:
  seedance:
    currency: ${BILLING_SEEDANCE_CURRENCY:CNY}
    price-per-second: ${BILLING_SEEDANCE_PRICE_PER_SECOND:1.20}
  comfyui:
    currency: ${BILLING_COMFYUI_CURRENCY:CNY}
    flat-price: ${BILLING_COMFYUI_FLAT_PRICE:0.01}
rate-limit:
  generate-user:
    enabled: ${RATE_LIMIT_GENERATE_USER_ENABLED:true}
    capacity: ${RATE_LIMIT_GENERATE_USER_CAPACITY:3}
    refill-tokens: ${RATE_LIMIT_GENERATE_USER_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_GENERATE_USER_REFILL_SECONDS:60}
  generate-admin:
    enabled: ${RATE_LIMIT_GENERATE_ADMIN_ENABLED:true}
    capacity: ${RATE_LIMIT_GENERATE_ADMIN_CAPACITY:30}
    refill-tokens: ${RATE_LIMIT_GENERATE_ADMIN_REFILL_TOKENS:10}
    refill-seconds: ${RATE_LIMIT_GENERATE_ADMIN_REFILL_SECONDS:60}
  generate-ip:
    enabled: ${RATE_LIMIT_GENERATE_IP_ENABLED:true}
    capacity: ${RATE_LIMIT_GENERATE_IP_CAPACITY:5}
    refill-tokens: ${RATE_LIMIT_GENERATE_IP_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_GENERATE_IP_REFILL_SECONDS:60}
  prompt-optimize-user:
    enabled: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_ENABLED:true}
    capacity: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_CAPACITY:20}
    refill-tokens: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_REFILL_TOKENS:5}
    refill-seconds: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_REFILL_SECONDS:60}
  prompt-optimize-ip:
    enabled: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_ENABLED:true}
    capacity: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_CAPACITY:30}
    refill-tokens: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_REFILL_TOKENS:10}
    refill-seconds: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_REFILL_SECONDS:60}
  register-ip:
    enabled: ${RATE_LIMIT_REGISTER_IP_ENABLED:true}
    capacity: ${RATE_LIMIT_REGISTER_IP_CAPACITY:2}
    refill-tokens: ${RATE_LIMIT_REGISTER_IP_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_REGISTER_IP_REFILL_SECONDS:3600}
  # 对外 API：按钥匙限流（提交任务消耗令牌；429 带 Retry-After）
  api-key:
    enabled: ${RATE_LIMIT_API_KEY_ENABLED:true}
    capacity: ${RATE_LIMIT_API_KEY_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_API_KEY_REFILL_TOKENS:5}
    refill-seconds: ${RATE_LIMIT_API_KEY_REFILL_SECONDS:60}
mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_PLUS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: org.example.seedancegenarate.entity
