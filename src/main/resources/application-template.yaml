spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 池上限受 MySQL max_connections（默认 151）约束，不受本机核数约束。
    # 多实例部署时：单实例池大小 × 实例数 + 运维余量 < max_connections。
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_MAX:50}
      minimum-idle: ${SPRING_DATASOURCE_POOL_MIN_IDLE:10}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:10000}
      max-lifetime: ${SPRING_DATASOURCE_MAX_LIFETIME:1200000}
      idle-timeout: ${SPRING_DATASOURCE_IDLE_TIMEOUT:300000}
      keepalive-time: ${SPRING_DATASOURCE_KEEPALIVE:120000}
      pool-name: SeedanceHikari
  data:
    redis:
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: ${SPRING_REDIS_TIMEOUT:3s}
      lettuce:
        # 每个请求都用 Redis（查 token + 限流）；池子小会成为隐形串行点
        pool:
          max-active: ${SPRING_REDIS_MAX_ACTIVE:128}
          max-idle: ${SPRING_REDIS_MAX_IDLE:128}
          min-idle: ${SPRING_REDIS_MIN_IDLE:16}
          # 不用 -1ms（无限等待）：池满时要快速失败，不要让请求全部卡住
          max-wait: ${SPRING_REDIS_MAX_WAIT:2000ms}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
    test-connection: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  application:
    name: SeedanceGenarate
  # @Scheduled 现有 8 处（推进器 / 终态消费 / 流水线消费 / 两个对账 /
  # token 清理 / 视频清理 / webhook 重试），线程数要留余量
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:12}
  sql:
    init:
      # 数据库结构由 Flyway 版本化迁移管理；schema.sql 仅保留为历史参考，不再启动自动执行。
      mode: ${SPRING_SQL_INIT_MODE:never}
      continue-on-error: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    # 本地已有 schema.sql 初始化过的库可自动 baseline；生产首次接入前应先备份并确认当前结构。
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
server:
  port: ${SERVER_PORT:8080}
  # 只让 Tomcat 的受信代理规则解析转发头；业务代码始终读取 remoteAddr。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
    threads:
      # 提交接口同步跑完外部调用链（上传 OSS → 调提供方），单请求可能占线程数十秒，
      # 所以按「并发提交数」算，不按核数算
      max: ${SERVER_TOMCAT_MAX_THREADS:800}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:50}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:500}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:10000}
    # SSE 是长连接：默认 100 次 keep-alive 后连接会被回收
    max-keep-alive-requests: ${SERVER_TOMCAT_MAX_KEEPALIVE:-1}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:20000}
  # 只压 JSON。压缩 text/event-stream 会攒缓冲，毁掉 SSE 实时性
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: application/json
    min-response-size: 2048
auth:
  # 登录/注册与验证码入口在 JSON 反序列化前执行的请求体上限；防止畸形大包绕过业务字段守卫。
  request-body-max-bytes: ${AUTH_REQUEST_BODY_MAX_BYTES:16384}
  token:
    ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:259200}
    # 剩余有效期低于 5 分钟时，认证拦截链续回完整 TTL。
    refresh-threshold-seconds: ${AUTH_TOKEN_REFRESH_THRESHOLD_SECONDS:300}
    key-prefix: ${AUTH_TOKEN_REDIS_KEY_PREFIX:local:seedance:auth:token}

captcha:
  redis-key-prefix: ${CAPTCHA_REDIS_KEY_PREFIX:local:seedance:captcha}
  proof-ttl-seconds: ${CAPTCHA_PROOF_TTL_SECONDS:120}
registration:
  email:
    # 不同环境共用 Redis 时必须使用不同前缀；发件人未单独配置时回退 spring.mail.username。
    redis-key-prefix: ${REGISTRATION_EMAIL_REDIS_KEY_PREFIX:local:seedance:registration-email}
    from: ${REGISTRATION_EMAIL_FROM:${SPRING_MAIL_USERNAME}}
seedance:
  api-key: ${SEEDANCE_API_KEY}
  model: ${SEEDANCE_MODEL:doubao-seedance-2-0-260128}
  url: ${SEEDANCE_URL:https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks}
  # 方舟接口超时（元数据接口，秒回）；不设超时会在 Ark 挂起时焊死提交线程与轮询线程
  connect-timeout-ms: ${SEEDANCE_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${SEEDANCE_READ_TIMEOUT_MS:30000}
  models:
    - id: seedance
      name: ${SEEDANCE_MODEL_1:doubao-seedance-2-0-260128}
      label: Seedance 2.0
    - id: seedance-fast
      name: ${SEEDANCE_MODEL_FAST:doubao-seedance-2-0-fast-260128}
      label: Seedance 2.0 Fast
    - id: seedance-mini
      name: ${SEEDANCE_MODEL_MINI:doubao-seedance-2-0-mini-260615}
      label: Seedance 2.0 Mini
video:
  default-provider: ${VIDEO_DEFAULT_PROVIDER:seedance}
  model-access:
    default-open: ${VIDEO_MODEL_ACCESS_DEFAULT_OPEN:true}
  poll:
    enabled: ${VIDEO_POLL_ENABLED:true}
    interval-ms: ${VIDEO_POLL_INTERVAL_MS:2000}
    initial-delay-ms: ${VIDEO_POLL_INITIAL_DELAY_MS:5000}
    max-age-hours: ${VIDEO_POLL_MAX_AGE_HOURS:24}
    batch-size: ${VIDEO_POLL_BATCH_SIZE:200}
    # 单轮推进的时间预算（毫秒）；上限被轮询锁 TTL(300s) 的一半夹死
    round-budget-ms: ${VIDEO_POLL_ROUND_BUDGET_MS:150000}
  # 任务超时自动处理（对账兜底）：本轮尝试超过阈值仍 PROCESSING → 最后确认 → 决策
  task-timeout-minutes: ${VIDEO_TASK_TIMEOUT_MINUTES:60}
  # 自动重试上限：仅 ON_SUCCESS 计费引擎（ComfyUI 免费重跑）生效；0 = 只失败不重试
  timeout-retry-max: ${VIDEO_TIMEOUT_RETRY_MAX:2}
  # 提交断裂判定：PROCESSING 且 provider_task_id 为空超过该时长 → 终止
  submit-stall-minutes: ${VIDEO_SUBMIT_STALL_MINUTES:10}
  # 单轮对账的时间预算（毫秒），四个分支平分；上限被对账锁 TTL(120s) 的一半夹死
  reconcile-round-budget-ms: ${VIDEO_RECONCILE_ROUND_BUDGET_MS:60000}
  # 产物保留天数：**必须与 OSS 控制台的生命周期规则 outputs-expire 对齐**。
  # 代码不去读 OSS 的规则（为此加一个跨网依赖不值得），靠启动配置指纹让人一眼对照。
  # 判定基准是 create_time 而非 update_time：后者会被后续行更新往后推，
  # 那会让应用说「没过期」而 OSS 已删 —— 用户拿到一个转不出来的播放器。
  # < 1 表示关闭过期判定（不是「一切立刻过期」）。
  artifact-retention-days: ${VIDEO_ARTIFACT_RETENTION_DAYS:30}
  # ETA 样本时长上限（分钟）：对账补终态的历史卡死任务时长虚大，超过上限的样本剔除
  eta-max-sample-minutes: ${VIDEO_ETA_MAX_SAMPLE_MINUTES:90}
  cleanup:
    # OSS 产物由 Bucket Lifecycle 清理；仅打开此项才清理迁移前的本地 data/videos 文件。
    local-enabled: ${VIDEO_CLEANUP_LOCAL_ENABLED:false}
  completion:
    # 事件驱动（CALLBACK）引擎的回调公网基址；未配置时回退轮询（对账兜底）。
    callback-base-url: ${VIDEO_CALLBACK_BASE_URL:}
    # 回调鉴权 token（防伪造回调）；必须为随机长串。
    callback-secret: ${VIDEO_CALLBACK_SECRET:}
  comfyui:
    scheduling: ${VIDEO_COMFYUI_SCHEDULING:least-queue}
    connect-timeout-ms: ${VIDEO_COMFYUI_CONNECT_TIMEOUT_MS:3000}
    # 提交 / 上传 / 下载素材：载荷可达几十 MB，必须给足
    read-timeout-ms: ${VIDEO_COMFYUI_READ_TIMEOUT_MS:60000}
    # 状态查询（/history、/queue）：只读几 KB JSON。别和上面共用——
    # 共用时一台 hang 住的节点能让对账的单条任务阻塞满 60 秒。下限 1000ms（0 = 无限等待）
    status-timeout-ms: ${VIDEO_COMFYUI_STATUS_TIMEOUT_MS:5000}
    # 这台 ComfyUI 是否真的会回调；原生 ComfyUI 不支持，装了 JobNotify 这类扩展才置 true。
    webhook-supported: ${VIDEO_COMFYUI_WEBHOOK_SUPPORTED:false}
    # /queue 响应可能几 MB，按节点短缓存（只用于轮询，调度取实时）；0=不缓存。
    queue-cache-ms: ${VIDEO_COMFYUI_QUEUE_CACHE_MS:3000}
    # 访问令牌：所有请求统一带 X-Comfy-Token（与 nginx 入口校验一致）。
    access-token: ${COMFYUI_ACCESS_TOKEN:}
    nodes:
      - id: gpu-0
        base-url: ${COMFYUI_NODE0_URL}
        enabled: ${COMFYUI_NODE0_ENABLED:true}
      - id: gpu-1
        base-url: ${COMFYUI_NODE1_URL}
        enabled: ${COMFYUI_NODE1_ENABLED:true}
      - id: gpu-3
        base-url: ${COMFYUI_NODE3_URL}
        enabled: ${COMFYUI_NODE3_ENABLED:true}
      - id: gpu-6
        base-url: ${COMFYUI_NODE6_URL}
        enabled: ${COMFYUI_NODE6_ENABLED:true}
prompt-optimize:
  url: ${PROMPT_OPTIMIZE_URL}
  api-key: ${PROMPT_OPTIMIZE_API_KEY}
  model: ${PROMPT_OPTIMIZE_MODEL:gemma-4-31b}
file:
  upload-path: ${FILE_UPLOAD_PATH:./data/images}
billing:
  seedance:
    currency: ${BILLING_SEEDANCE_CURRENCY:CNY}
    price-per-second: ${BILLING_SEEDANCE_PRICE_PER_SECOND:1.20}
  comfyui:
    currency: ${BILLING_COMFYUI_CURRENCY:CNY}
    flat-price: ${BILLING_COMFYUI_FLAT_PRICE:0.01}
feature:
  # 关闭时回退本地令牌桶，只适用于单实例开发；多 API 实例必须开启。
  redis-rate-limit: ${FEATURE_REDIS_RATE_LIMIT:false}
  # 开启后通过 Redis Pub/Sub 广播任务终态，跨实例 SSE 才能收到通知。
  redis-task-events: ${FEATURE_REDIS_TASK_EVENTS:false}
  # 开启后模型开关/改价立刻广播给其他实例（毫秒级一致）；
  # 关闭时各实例靠 cache.config.reload-interval-ms 兜底重载，多实例下开关变更会滞后一个周期。
  redis-config-invalidation: ${FEATURE_REDIS_CONFIG_INVALIDATION:false}

task-events:
  # 跨实例任务状态事件（SSE）频道。事件里带 userId，不同环境共用 Redis 时必须换前缀，
  # 否则生产的任务完成事件会推给别的环境的 SSE 订阅者。
  channel: ${TASK_STATUS_REDIS_CHANNEL:local:seedance:event:task-status}

config-invalidation:
  channel: ${CONFIG_INVALIDATION_REDIS_CHANNEL:local:seedance:event:config-invalidation}

# ============================================================
# 请求路径缓存与写合并（全部可单独关掉回退原行为）
# ============================================================
cache:
  activity:
    # 最后活跃 IP / 最后操作：按用户合并后批量落库，不再每请求一次 UPDATE
    enabled: ${CACHE_ACTIVITY_ENABLED:true}
    flush-interval-ms: ${CACHE_ACTIVITY_FLUSH_INTERVAL_MS:5000}
  config:
    # 模型开关与计价配置的进程内快照
    enabled: ${CACHE_CONFIG_ENABLED:true}
    reload-interval-ms: ${CACHE_CONFIG_RELOAD_INTERVAL_MS:60000}
  stats:
    # 管理端聚合统计（dashboard 会把整张 video_task 读进内存聚合）
    enabled: ${CACHE_STATS_ENABLED:true}
    ttl-ms: ${CACHE_STATS_TTL_MS:30000}

distributed:
  lock:
    # 多实例部署时开启，保证 VideoTaskPoller / WebhookDispatcher 同一时刻只在一个实例执行。
    enabled: ${DISTRIBUTED_LOCK_ENABLED:false}
    key-prefix: ${DISTRIBUTED_LOCK_KEY_PREFIX:local:seedance:lock}
    default-ttl-seconds: ${DISTRIBUTED_LOCK_TTL_SECONDS:120}

pipeline:
  # 持久化作业驱动（默认）；关闭回退旧版本地线程池（仅单实例灰度回滚用）。
  job-driven: ${PIPELINE_JOB_DRIVEN:true}

async-job:
  # 作业可用时经 Redis 通知即时唤醒消费；此间隔仅作通知丢失的兜底扫描。
  reconcile-interval-ms: ${ASYNC_JOB_RECONCILE_INTERVAL_MS:30000}
  initial-delay-ms: ${ASYNC_JOB_INITIAL_DELAY_MS:10000}
  claim-batch-size: ${ASYNC_JOB_CLAIM_BATCH_SIZE:20}
  lease-seconds: ${ASYNC_JOB_LEASE_SECONDS:60}
  max-attempts: ${ASYNC_JOB_MAX_ATTEMPTS:5}
  backoff-base-seconds: ${ASYNC_JOB_BACKOFF_BASE_SECONDS:30}
  channel: ${ASYNC_JOB_REDIS_CHANNEL:local:seedance:event:job-available}

api-key:
  # 每账号可持有的 key 数量上限。每把 key 都是一个泄漏面；
  # 限流按**账号**分桶（不是按 key），所以多建 key 不放大配额，这个数只挡「脚本无限建」。
  max-per-user: ${API_KEY_MAX_PER_USER:50}

rate-limit:
  # Redis key 使用 {环境}:seedance:rate:{场景}:{身份}；不同环境共用 Redis 时请使用不同前缀。
  redis-key-prefix: ${RATE_LIMIT_REDIS_KEY_PREFIX:local:seedance:rate}
  generate-user:
    enabled: ${RATE_LIMIT_GENERATE_USER_ENABLED:true}
    capacity: ${RATE_LIMIT_GENERATE_USER_CAPACITY:3}
    refill-tokens: ${RATE_LIMIT_GENERATE_USER_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_GENERATE_USER_REFILL_SECONDS:60}
  generate-admin:
    enabled: ${RATE_LIMIT_GENERATE_ADMIN_ENABLED:true}
    capacity: ${RATE_LIMIT_GENERATE_ADMIN_CAPACITY:30}
    refill-tokens: ${RATE_LIMIT_GENERATE_ADMIN_REFILL_TOKENS:10}
    refill-seconds: ${RATE_LIMIT_GENERATE_ADMIN_REFILL_SECONDS:60}
  generate-ip:
    enabled: ${RATE_LIMIT_GENERATE_IP_ENABLED:true}
    capacity: ${RATE_LIMIT_GENERATE_IP_CAPACITY:5}
    refill-tokens: ${RATE_LIMIT_GENERATE_IP_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_GENERATE_IP_REFILL_SECONDS:60}
  captcha-get-ip:
    enabled: true
    capacity: ${RATE_LIMIT_CAPTCHA_GET_IP_CAPACITY:30}
    refill-tokens: ${RATE_LIMIT_CAPTCHA_GET_IP_REFILL_TOKENS:30}
    refill-seconds: ${RATE_LIMIT_CAPTCHA_GET_IP_REFILL_SECONDS:60}
  captcha-check-ip:
    enabled: true
    capacity: ${RATE_LIMIT_CAPTCHA_CHECK_IP_CAPACITY:30}
    refill-tokens: ${RATE_LIMIT_CAPTCHA_CHECK_IP_REFILL_TOKENS:30}
    refill-seconds: ${RATE_LIMIT_CAPTCHA_CHECK_IP_REFILL_SECONDS:60}
  login-ip:
    enabled: true
    capacity: ${RATE_LIMIT_LOGIN_IP_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_LOGIN_IP_REFILL_TOKENS:5}
    refill-seconds: ${RATE_LIMIT_LOGIN_IP_REFILL_SECONDS:60}
  login-username:
    enabled: true
    capacity: ${RATE_LIMIT_LOGIN_USERNAME_CAPACITY:5}
    refill-tokens: ${RATE_LIMIT_LOGIN_USERNAME_REFILL_TOKENS:2}
    refill-seconds: ${RATE_LIMIT_LOGIN_USERNAME_REFILL_SECONDS:60}
  prompt-optimize-user:
    enabled: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_ENABLED:true}
    capacity: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_CAPACITY:20}
    refill-tokens: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_REFILL_TOKENS:5}
    refill-seconds: ${RATE_LIMIT_PROMPT_OPTIMIZE_USER_REFILL_SECONDS:60}
  prompt-optimize-ip:
    enabled: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_ENABLED:true}
    capacity: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_CAPACITY:30}
    refill-tokens: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_REFILL_TOKENS:10}
    refill-seconds: ${RATE_LIMIT_PROMPT_OPTIMIZE_IP_REFILL_SECONDS:60}
  register-ip:
    enabled: true
    capacity: ${RATE_LIMIT_REGISTER_IP_CAPACITY:2}
    refill-tokens: ${RATE_LIMIT_REGISTER_IP_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_REGISTER_IP_REFILL_SECONDS:3600}
  register-username:
    enabled: true
    capacity: ${RATE_LIMIT_REGISTER_USERNAME_CAPACITY:2}
    refill-tokens: ${RATE_LIMIT_REGISTER_USERNAME_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_REGISTER_USERNAME_REFILL_SECONDS:3600}
  register-email-ip:
    enabled: true
    capacity: ${RATE_LIMIT_REGISTER_EMAIL_IP_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_REGISTER_EMAIL_IP_REFILL_TOKENS:5}
    refill-seconds: ${RATE_LIMIT_REGISTER_EMAIL_IP_REFILL_SECONDS:3600}
  register-email-address:
    enabled: true
    capacity: ${RATE_LIMIT_REGISTER_EMAIL_ADDRESS_CAPACITY:3}
    refill-tokens: ${RATE_LIMIT_REGISTER_EMAIL_ADDRESS_REFILL_TOKENS:1}
    refill-seconds: ${RATE_LIMIT_REGISTER_EMAIL_ADDRESS_REFILL_SECONDS:600}
  register-email-global:
    enabled: true
    capacity: ${RATE_LIMIT_REGISTER_EMAIL_GLOBAL_CAPACITY:120}
    refill-tokens: ${RATE_LIMIT_REGISTER_EMAIL_GLOBAL_REFILL_TOKENS:120}
    refill-seconds: ${RATE_LIMIT_REGISTER_EMAIL_GLOBAL_REFILL_SECONDS:60}
  api-key:
    enabled: ${RATE_LIMIT_API_KEY_ENABLED:true}
    capacity: ${RATE_LIMIT_API_KEY_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_API_KEY_REFILL_TOKENS:5}
    refill-seconds: ${RATE_LIMIT_API_KEY_REFILL_SECONDS:60}
mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_PLUS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    # 默认关掉 SQL 全量打印：生产开着会把真正的 WARN/ERROR 淹掉（2026-08-26 排查账务异常时
    # 就是 95% 的日志都是 Preparing/Parameters）。本地排查时设
    # MYBATIS_PLUS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl 打开。
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: org.example.seedancegenarate.entity
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME}
    # 可填 https://bucket.endpoint 或裸域名；应用会为裸域名自动补 https://。
    domain: ${ALIYUN_OSS_DOMAIN}
    # 生成视频/图片的正式产物前缀；OSS 是唯一权威存储。
    artifact-prefix: ${ALIYUN_OSS_ARTIFACT_PREFIX:outputs}
    # 后端鉴权后签发的播放/下载 URL 有效期（秒）。
    signed-url-ttl-seconds: ${ALIYUN_OSS_SIGNED_URL_TTL_SECONDS:300}
# 可观测性：/actuator/prometheus 暴露 Prometheus 指标（业务指标见 MetricsExportTask）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${SPRING_APPLICATION_NAME:seedance-backend}

wechat:
  pay:
    enabled: ${WECHAT_PAY_ENABLED:true}
    app-id: ${WECHAT_PAY_APP_ID:wxbdfefbd6cca026e1}
    mch-id: ${WECHAT_PAY_MCH_ID:1116376414}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:fe3c22dbd689b41a943423769e5a55e1}
    api-v3-key-path: ${WECHAT_PAY_API_V3_KEY_PATH:classpath:wechat/apiv3_key.txt}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:classpath:wechat/apiclient_key.pem}
    merchant-cert-path: ${WECHAT_PAY_MERCHANT_CERT_PATH:classpath:wechat/apiclient_cert.pem}
    merchant-serial-number: ${WECHAT_PAY_SERIAL_NUMBER:17578DB1B6BA6874062E062323BC5559C86A60C6}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://api-generate.creator.ascent-ai.cn/api/notify/wechat}

# ============================================================
# 日志
# 改动前既没有 logback.xml 也没有这一段：只往 stdout 走，没有文件、没有滚动上限，
# 也没法在不改代码的情况下临时开某个包的 DEBUG。
# 2026-08-26 线上被扫描器每秒一发地打 50 行堆栈时，这两件事都很要命。
# ============================================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    # AJ 1.4.0 的 DEBUG 会输出 token 与隐藏坐标，必须独立钉在 INFO 以上。
    com.anji.captcha: INFO
    # 排查时把这个调成 DEBUG 就能看到 poll 判定、缓存命中这类过程日志，不用改代码重新构建
    org.example.seedancegenarate: ${LOG_LEVEL_APP:INFO}
  logback:
    rollingpolicy:
      # 仅在设置了 LOG_FILE 时生效；容器里默认只走 stdout，交给 docker 的 log-opts 滚动
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:14}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:5GB}
