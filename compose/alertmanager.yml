# Alertmanager 配置：默认只做路由，告警出口按需接入钉钉/企业微信（选一种取消注释并填 webhook 地址）。
# Prometheus 的告警默认就会在 Alertmanager 界面（:9093）看到；接钉钉后手机也能收。
route:
  group_by: [ 'alertname', 'instance' ]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default
    # --- 钉钉机器人（推荐，加签方式） ---
